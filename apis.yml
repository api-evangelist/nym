aid: nym
name: Nym
description: >-
  Nym is a healthcare technology company providing autonomous medical coding for
  health systems, hospitals, and physician groups. Its proprietary Clinical
  Language Understanding (CLU) engine reads clinical documentation and assigns
  accurate medical codes (ICD-10, CPT, and E/M) without human intervention,
  combining machine reading with transparent, rules-based coding logic rather
  than generic natural language processing. Nym automates revenue cycle
  management to reduce coding costs, accelerate billing, and improve charge
  capture across 400+ US healthcare facilities, and is used by health systems
  including OSF, Ochsner Health, Inova, and Henry Ford. Backed by Bessemer
  Venture Partners and Lightspeed Venture Partners. Nym does not currently
  publish a public developer API, SDK, or developer portal.
